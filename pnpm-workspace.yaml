allowBuilds:
  canvas: set this to true or false
  core-js: set this to true or false
  core-js-pure: set this to true or false
# Switched from npm 10.15.2026. Hoisted keeps the flat npm layout that
# Capacitor, create-react-app and older tooling expect, while still linking
# from the shared pnpm store.
nodeLinker: hoisted
strictDepBuilds: false
